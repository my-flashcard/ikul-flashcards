<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikul Flashcard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fdf8f0;--surface:#fffdf9;--text:#2b2420;--muted:#7a6a5d;--accent:#c96a1b;--accent-t:#fff;--back:#fdeedc;--line:#ecdcc8;--danger:#b02a2a;--ok:#2b8a3e;--p1:rgba(232,135,58,.35);--p2:rgba(43,36,32,.14);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a17;--surface:#2a2420;--text:#f5ece1;--muted:#b3a496;--accent:#f0a060;--accent-t:#1e1a17;--back:#3a2d24;--line:#4a3d33;--danger:#ff8787;--ok:#69db7c;--p1:rgba(240,160,96,.22);--p2:rgba(255,255,255,.06);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1a17;--surface:#2a2420;--text:#f5ece1;--muted:#b3a496;--accent:#f0a060;--accent-t:#1e1a17;--back:#3a2d24;--line:#4a3d33;--danger:#ff8787;--ok:#69db7c;--p1:rgba(240,160,96,.22);--p2:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 100% 0,var(--p2) 0 80px,transparent 81px),radial-gradient(circle at 0 52%,var(--p1) 0 60px,transparent 61px),radial-gradient(circle at 100% 100%,var(--p1) 0 110px,transparent 111px),radial-gradient(circle at 0 100%,var(--p2) 0 50px,transparent 51px);background-attachment:fixed;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0}h3{margin:0 0 4px;font-size:1.05rem}h2{margin:6px 0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.brand svg{width:48px;height:48px;flex:none}.brand small{display:block;color:var(--accent);letter-spacing:.2em;font-size:.7rem;font-weight:600;text-transform:uppercase}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
:root[data-theme="light"]{--bg:#fff;--surface:#fff;--text:#2b2420;--muted:#7a6a5d;--accent:#c96a1b;--accent-t:#fff;--back:#fff4e6;--line:#eadfd2;--danger:#b02a2a;--ok:#2b8a3e;--p1:rgba(232,135,58,.22);--p2:rgba(43,36,32,.08);color-scheme:light}
.theme{margin-left:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}.theme button{border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;padding:5px 10px;border-radius:999px;cursor:pointer}.theme button.on{background:var(--accent);color:var(--accent-t)}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 14px;flex-wrap:wrap}.sync{font-size:.78rem;color:var(--muted);flex:1;min-width:160px}#uname{font-size:.85rem;color:var(--muted);margin-right:6px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;border:0;background:none;color:var(--muted);font:inherit;padding:9px;border-radius:9px;cursor:pointer;font-weight:600}
.tab.on{background:var(--accent);color:var(--accent-t)}
.count{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.scene{perspective:1200px;height:340px}
.card{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 18px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.07)}
.face.back{transform:rotateY(180deg);background:var(--back)}
.tag{position:absolute;top:12px;left:16px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ftag{position:absolute;top:10px;right:14px;font-size:.75rem;color:var(--accent);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.word{font-size:2.2rem;font-weight:700;overflow-wrap:anywhere}
.meaning{font-size:1.8rem;font-weight:650;overflow-wrap:anywhere}
.reveal{background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.extra{display:none;font-style:italic;color:var(--muted);font-size:1.02rem;max-width:100%;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:12px;width:100%}
.extra.show{display:block}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin:10px 0 14px}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.del{color:var(--danger)}.btn.no{color:var(--danger);flex:1}.btn.yes{color:var(--ok);flex:1}
.btn:disabled{opacity:.4;cursor:default}
.frow,.pick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.frow .fn,.pick .fn{flex:1;min-width:0;overflow-wrap:anywhere}
.fn small,.pick small{display:block;color:var(--muted)}
.pick{cursor:pointer}.pick input{width:20px;height:20px;accent-color:var(--accent)}
.sm{padding:6px 10px;font-size:.85rem}
.box{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.addf{display:flex;gap:8px;margin-top:6px}
label.l{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
.msg{font-size:.85rem;color:var(--danger);margin-top:8px;min-height:1em}
.opt{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done{text-align:center;padding:30px 10px}.done .big{font-size:3rem}
</style>
</head>
<body>
<main>
<div class="brand"><svg viewBox="0 0 80 80" aria-hidden="true"><defs><clipPath id="hc"><ellipse cx="40" cy="46" rx="29" ry="25"/></clipPath></defs><path d="M13 34 L15 7 L35 22Z" fill="#e8873a"/><path d="M67 34 L65 7 L45 22Z" fill="#2b2420"/><path d="M18 28 L19 14 L28 22Z" fill="#f4b6b6"/><path d="M62 28 L61 14 L52 22Z" fill="#f4b6b6"/><ellipse cx="40" cy="46" rx="29" ry="25" fill="#fffaf2" stroke="#ecdcc8"/><g clip-path="url(#hc)"><circle cx="16" cy="40" r="17" fill="#e8873a"/><path d="M52 18 h30 v30 h-14 q-6 -8 -16 -10z" fill="#2b2420"/><circle cx="52" cy="72" r="9" fill="#e8873a"/></g><ellipse cx="29" cy="46" rx="3.6" ry="4.6" fill="#2b2420"/><ellipse cx="51" cy="46" rx="3.6" ry="4.6" fill="#2b2420"/><circle cx="30.2" cy="44.5" r="1.3" fill="#fff"/><circle cx="52.2" cy="44.5" r="1.3" fill="#fff"/><path d="M37 53 h6 l-3 4z" fill="#f08a8a"/><path d="M40 57 q-3 4 -7 2 M40 57 q3 4 7 2" fill="none" stroke="#2b2420" stroke-width="1.6" stroke-linecap="round"/><path d="M18 52 l-10 -2 M18 56 l-10 3 M62 52 l10 -2 M62 56 l10 3" stroke="#2b2420" stroke-width="1.4" stroke-linecap="round"/></svg><div><h1>Ikul</h1><small>Flashcard</small></div><div class="theme" role="group" aria-label="Pilih tema"><button data-th="light">☀️ Day</button><button data-th="dark">🌙 Dark</button></div></div>
<p class="sub">🐾 Kelompokkan kartu dalam folder, lalu latihan dari satu atau beberapa folder.</p>
<div class="acct"><div class="sync" id="sync"></div><div id="authBox"><button class="btn sm primary" id="loginBtn">Masuk dengan Google</button><span id="userBox" hidden><span id="uname"></span> <button class="btn sm" id="logoutBtn">Keluar</button></span></div></div><div id="app"></div>
</main>
<script>
(function(){
var KEY='flashcards-v2',OLD='flashcards-v1';
function uid(){return Math.random().toString(36).slice(2,9)}
function mk(a,f){return a.map(function(c){return{id:uid(),word:c[0],ex:c[1],mean:c[2],exMean:c[3],folder:f}})}
function load(){
 try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.folders&&d.cards)return d}}catch(e){}
 try{var o=localStorage.getItem(OLD);if(o){var a=JSON.parse(o);if(Array.isArray(a)&&a.length){var f=uid();return{folders:[{id:f,name:'Umum'}],cards:a.map(function(c){return{id:uid(),word:c.word,ex:c.ex,mean:c.mean,exMean:c.exMean,folder:f}})}}}}catch(e){}
 var f1=uid(),f2=uid();
 return{folders:[{id:f1,name:'Kata Sifat'},{id:f2,name:'Kata Kerja'}],cards:
 mk([['resilient','She is resilient in tough times.','tangguh; cepat pulih','Dia tangguh di masa-masa sulit.'],['meticulous','He is meticulous about his work.','teliti','Dia sangat teliti dalam pekerjaannya.'],['ephemeral','Fame can be ephemeral.','sekejap; tidak abadi','Ketenaran bisa bersifat sementara.']],f1)
 .concat(mk([['embrace','Learn to embrace change.','merangkul; menerima','Belajarlah menerima perubahan.'],['procrastinate','Don’t procrastinate on your homework.','menunda-nunda','Jangan menunda-nunda PR-mu.']],f2))}
}
var D=load(),ui={tab:'folders',sel:{},shuf:true,s:null,edit:null,lastF:null};
function save(){D.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}push()}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cnt(f){return D.cards.filter(function(c){return c.folder===f}).length}
function card(id){return D.cards.filter(function(c){return c.id===id})[0]}
function fname(id){var f=D.folders.filter(function(x){return x.id===id})[0];return f?f.name:''}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var app=document.getElementById('app');
var TK='ikul-theme';
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);var b=document.querySelectorAll('.theme button');for(var i=0;i<b.length;i++)b[i].classList.toggle('on',b[i].dataset.th===t)}
var th=null;try{th=localStorage.getItem(TK)}catch(e){}
if(th!=='light'&&th!=='dark')th=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
applyTheme(th);
document.querySelector('.theme').addEventListener('click',function(e){var b=e.target.closest('[data-th]');if(!b)return;applyTheme(b.dataset.th);try{localStorage.setItem(TK,b.dataset.th)}catch(x){}});

function formSec(c){
 var e=!!c;c=c||{};
 if(!D.folders.length)return'<section class="box"><div class="empty" style="border:0;padding:10px">Buat folder dulu sebelum menambah kartu.</div></section>';
 var sel=c.folder||ui.lastF||D.folders[0].id;
 var o=D.folders.map(function(f){return'<option value="'+f.id+'"'+(f.id===sel?' selected':'')+'>'+esc(f.name)+'</option>'}).join('');
 return'<section class="box"><h3>'+(e?'Edit kartu':'Tambah kartu')+'</h3>'+
 '<label class="l">Folder *</label><select id="fFolder">'+o+'</select>'+
 '<label class="l">Kata *</label><input type="text" id="fWord" value="'+esc(c.word)+'" placeholder="mis. resilient">'+
 '<label class="l">Contoh kalimat</label><textarea id="fEx" placeholder="mis. She is resilient in tough times.">'+esc(c.ex)+'</textarea>'+
 '<label class="l">Arti kata *</label><input type="text" id="fMean" value="'+esc(c.mean)+'" placeholder="mis. tangguh">'+
 '<label class="l">Arti kalimat</label><textarea id="fExMean" placeholder="mis. Dia tangguh di masa-masa sulit.">'+esc(c.exMean)+'</textarea>'+
 '<div class="msg" id="msg"></div><div class="row"><button class="btn primary" data-act="savecard">'+(e?'Perbarui kartu':'Simpan kartu')+'</button>'+(e?'<button class="btn" data-act="cancel">Batal</button>':'')+'</div></section>';
}
function tabs(){return'<div class="tabs"><button class="tab'+(ui.tab==='folders'?' on':'')+'" data-act="tab" data-id="folders">📁 Folder</button><button class="tab'+(ui.tab==='practice'?' on':'')+'" data-act="tab" data-id="practice">🎯 Latihan</button></div>'}
function foldersV(){
 var h=D.folders.length?D.folders.map(function(f){return'<div class="frow"><div class="fn"><b>'+esc(f.name)+'</b><small>'+cnt(f.id)+' kartu</small></div><button class="btn sm primary" data-act="study" data-id="'+f.id+'">Belajar</button><button class="btn sm" data-act="rename" data-id="'+f.id+'" title="Ganti nama">✎</button><button class="btn sm del" data-act="delf" data-id="'+f.id+'" title="Hapus folder">🗑</button></div>'}).join(''):'<div class="empty">Belum ada folder.</div>';
 return h+'<div class="addf"><input type="text" id="nf" placeholder="Nama folder baru"><button class="btn primary" data-act="newf">Tambah</button></div>'+formSec();
}
function practiceV(){
 if(!D.folders.length)return'<div class="empty">Buat folder dan kartu dulu di tab Folder.</div>';
 var tot=0;
 var h='<h3>Pilih folder untuk latihan</h3><p class="sub" style="margin:0 0 10px">Kamu bisa memilih lebih dari satu folder.</p>'+D.folders.map(function(f){
  var on=ui.sel[f.id];if(on)tot+=cnt(f.id);
  return'<label class="pick"><input type="checkbox" data-act="pick" data-id="'+f.id+'"'+(on?' checked':'')+'><span class="fn"><b>'+esc(f.name)+'</b><small>'+cnt(f.id)+' kartu</small></span></label>'}).join('');
 return h+'<div class="nav" style="justify-content:flex-start"><button class="btn sm" data-act="all">Pilih semua</button><button class="btn sm" data-act="none">Kosongkan</button></div>'+
 '<label class="opt"><input type="checkbox" data-act="opt"'+(ui.shuf?' checked':'')+'> Acak urutan kartu</label>'+
 '<button class="btn primary" style="width:100%;padding:12px" data-act="start"'+(tot?'':' disabled')+'>Mulai latihan ('+tot+' kartu)</button>';
}
function sessV(){
 var s=ui.s,n=s.ids.length,p=s.mode==='practice';
 if(s.done){var k=s.ids.filter(function(i){return s.known[i]}).length;
  return'<div class="done"><div class="big">🐱</div><h2>Latihan selesai</h2><p>Hafal '+k+' dari '+n+' kartu</p><div class="nav">'+(n-k>0?'<button class="btn primary" data-act="retry">Ulangi yang belum hafal ('+(n-k)+')</button>':'')+'<button class="btn" data-act="retryall">Ulangi semua</button><button class="btn" data-act="back">Selesai</button></div></div>'}
 var c=card(s.ids[s.i]);
 var h='<div class="top"><button class="btn sm" data-act="back">← Kembali</button><b>'+esc(s.title)+'</b><span class="count" style="margin:0">'+(s.i+1)+'/'+n+'</span></div>';
 if(p)h+='<div class="bar"><i style="width:'+(s.i/n*100)+'%"></i></div>';
 h+='<div class="scene"><div class="card" data-act="flip"><div class="face"><span class="tag">Kata</span><span class="ftag">'+esc(fname(c.folder))+'</span><div class="word">'+esc(c.word)+'</div>'+
 (c.ex?'<button class="reveal" data-act="rev" data-t="ex">Lihat contoh kalimat</button><div class="extra" id="ex">'+esc(c.ex)+'</div>':'')+'</div>'+
 '<div class="face back"><span class="tag">Arti</span><div class="meaning">'+esc(c.mean)+'</div>'+
 (c.exMean?'<button class="reveal" data-act="rev" data-t="exm">Lihat arti kalimat</button><div class="extra" id="exm">'+esc(c.exMean)+'</div>':'')+'</div></div></div>'+
 '<div class="hint">Klik kartu untuk membalik</div>';
 if(p)h+='<div class="nav"><button class="btn no" data-act="unknown">✗ Belum hafal</button><button class="btn yes" data-act="known">✓ Hafal</button></div>';
 else h+='<div class="nav"><button class="btn" data-act="prev"'+(s.i===0?' disabled':'')+'>← Sebelumnya</button><button class="btn" data-act="next"'+(s.i===n-1?' disabled':'')+'>Berikutnya →</button></div>'+
 '<div class="nav" style="margin-top:8px"><button class="btn" data-act="shuffle">Acak</button><button class="btn" data-act="edit">Edit</button><button class="btn del" data-act="delc">Hapus</button></div>';
 if(ui.edit)h+=formSec(c);
 return h;
}
function render(){app.innerHTML=ui.s?sessV():tabs()+(ui.tab==='folders'?foldersV():practiceV())}
function begin(ids,title,mode){ui.s={ids:ids,i:0,mode:mode,title:title,known:{},done:false};ui.edit=null;render();window.scrollTo(0,0)}
function adv(){var s=ui.s;if(s.i<s.ids.length-1)s.i++;else s.done=true;render()}

app.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 var a=t.dataset.act,id=t.dataset.id,s=ui.s,v;
 if(a==='flip'){t.classList.toggle('flipped');return}
 if(a==='rev'){e.stopPropagation();var x=document.getElementById(t.dataset.t),on=x.classList.toggle('show'),ex=t.dataset.t==='ex';
  t.textContent=on?(ex?'Sembunyikan contoh kalimat':'Sembunyikan arti kalimat'):(ex?'Lihat contoh kalimat':'Lihat arti kalimat');return}
 if(a==='pick'){ui.sel[id]=t.checked;render();return}
 if(a==='opt'){ui.shuf=t.checked;return}
 switch(a){
 case'tab':ui.tab=id;render();break;
 case'newf':v=document.getElementById('nf').value.trim();if(!v)return;D.folders.push({id:uid(),name:v});save();render();break;
 case'rename':v=prompt('Nama folder baru:',fname(id));if(v&&v.trim()){D.folders.filter(function(f){return f.id===id})[0].name=v.trim();save();render()}break;
 case'delf':if(confirm('Hapus folder "'+fname(id)+'" beserta '+cnt(id)+' kartu di dalamnya?')){D.folders=D.folders.filter(function(f){return f.id!==id});D.cards=D.cards.filter(function(c){return c.folder!==id});delete ui.sel[id];save();render()}break;
 case'study':v=D.cards.filter(function(c){return c.folder===id}).map(function(c){return c.id});if(!v.length){alert('Folder ini masih kosong. Tambahkan kartu dulu.');return}begin(v,fname(id),'study');break;
 case'all':D.folders.forEach(function(f){ui.sel[f.id]=true});render();break;
 case'none':ui.sel={};render();break;
 case'start':var fs=D.folders.filter(function(f){return ui.sel[f.id]}),sel={};fs.forEach(function(f){sel[f.id]=1});
  v=D.cards.filter(function(c){return sel[c.folder]}).map(function(c){return c.id});if(!v.length)return;
  if(ui.shuf)shuffle(v);begin(v,fs.length+' folder','practice');break;
 case'back':ui.s=null;ui.edit=null;render();break;
 case'prev':s.i--;ui.edit=null;render();break;
 case'next':s.i++;ui.edit=null;render();break;
 case'shuffle':shuffle(s.ids);s.i=0;render();break;
 case'edit':ui.edit=s.ids[s.i];render();document.getElementById('fWord').scrollIntoView({behavior:'smooth',block:'center'});break;
 case'cancel':ui.edit=null;render();break;
 case'delc':if(confirm('Hapus kartu ini?')){var cid=s.ids[s.i];D.cards=D.cards.filter(function(c){return c.id!==cid});s.ids.splice(s.i,1);save();ui.edit=null;if(!s.ids.length)ui.s=null;else if(s.i>=s.ids.length)s.i=s.ids.length-1;render()}break;
 case'known':s.known[s.ids[s.i]]=true;adv();break;
 case'unknown':s.known[s.ids[s.i]]=false;adv();break;
 case'retry':s.ids=s.ids.filter(function(i){return!s.known[i]});s.known={};s.i=0;s.done=false;if(ui.shuf)shuffle(s.ids);render();break;
 case'retryall':s.known={};s.i=0;s.done=false;if(ui.shuf)shuffle(s.ids);render();break;
 case'savecard':
  var w=document.getElementById('fWord').value.trim(),m=document.getElementById('fMean').value.trim();
  if(!w||!m){document.getElementById('msg').textContent='Kata dan arti kata wajib diisi.';return}
  var o={word:w,ex:document.getElementById('fEx').value.trim(),mean:m,exMean:document.getElementById('fExMean').value.trim(),folder:document.getElementById('fFolder').value};
  ui.lastF=o.folder;
  if(ui.edit){var c=card(ui.edit);for(var k in o)c[k]=o[k];ui.edit=null}else{o.id=uid();D.cards.push(o)}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3I10N_G-SsIqzQMl2XPaOzuKdMcFA4mQ",
  authDomain: "my-flashcard-a1cb6.firebaseapp.com",
  projectId: "my-flashcard-a1cb6",
  storageBucket: "my-flashcard-a1cb6.firebasestorage.app",
  messagingSenderId: "23306322885",
  appId: "1:23306322885:web:68700571b8fc72411a01ac",
  measurementId: "G-XD76BET5C4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const GUEST = "\ud83d\udcbe Tersimpan di browser ini. Masuk dengan Google untuk menyimpan ke akunmu.";
let user = null, tmr = null;

async function writeNow() {
  const d = window.ikul.get();
  await setDoc(doc(db, "users", user.uid), { json: JSON.stringify(d), updated: d.updated || Date.now() });
}

window.pushCloud = () => {
  if (!user) return;
  clearTimeout(tmr);
  tmr = setTimeout(async () => {
    try { await writeNow(); window.ikul.status("\u2601\ufe0f Tersimpan di akun Google kamu"); }
    catch (e) { console.error(e); window.ikul.status("\u26a0\ufe0f Gagal sinkron ke cloud. Data tetap aman di browser ini."); }
  }, 700);
};

$("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { console.error(e); window.ikul.status("\u26a0\ufe0f Login dibatalkan atau gagal. Coba lagi."); }
};

$("logoutBtn").onclick = async () => {
  try { clearTimeout(tmr); if (user) await writeNow(); } catch (e) { console.error(e); }
  await signOut(auth);
  try { localStorage.removeItem("flashcards-v2"); } catch (e) {}
  location.reload();
};

onAuthStateChanged(auth, async (u) => {
  user = u;
  $("loginBtn").hidden = !!u;
  $("userBox").hidden = !u;
  if (!u) { window.ikul.status(GUEST); return; }
  $("uname").textContent = (u.displayName || u.email || "").split(" ")[0];
  window.ikul.status("\u2601\ufe0f Menyinkronkan\u2026");
  try {
    const ref = doc(db, "users", u.uid);
    const snap = await getDoc(ref);
    const local = window.ikul.get();
    if (snap.exists()) {
      const d = snap.data();
      const cloud = JSON.parse(d.json);
      if (cloud && cloud.folders && cloud.cards && (d.updated || 0) > (local.updated || 0)) {
        cloud.updated = d.updated;
        window.ikul.set(cloud);
        window.ikul.status("\u2601\ufe0f Tersinkron dengan akun Google kamu");
        return;
      }
    }
    await writeNow();
    window.ikul.status("\u2601\ufe0f Tersimpan di akun Google kamu");
  } catch (e) {
    console.error(e);
    window.ikul.status("\u26a0\ufe0f Cloud tidak bisa dihubungi (cek aturan Firestore). Data tetap aman di browser ini.");
  }
});
</script>
